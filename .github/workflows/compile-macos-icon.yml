name: Compile macOS Liquid Glass icon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-icon:
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile with Xcode 27
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers
          mkdir -p build/macos-icon
          xcrun actool macos/Insta360Linker.icon \
            --app-icon Insta360Linker \
            --compile build/macos-icon \
            --output-partial-info-plist build/macos-icon/assetcatalog_generated_info.plist \
            --minimum-deployment-target 12.0 \
            --platform macosx \
            --target-device mac
          test -s build/macos-icon/Assets.car
          test -s build/macos-icon/Insta360Linker.icns
          /usr/bin/assetutil --info build/macos-icon/Assets.car > build/macos-icon/Assets.json
          shasum -a 256 build/macos-icon/Assets.car build/macos-icon/Insta360Linker.icns

      - name: Upload compiled icon resources
        uses: actions/upload-artifact@v4
        with:
          name: macos-liquid-glass-icon
          path: build/macos-icon
          if-no-files-found: error
