name: Build Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS ARM64 (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | tr -d '\r' | head -n 1)"
          test -n "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)" = "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify source and build app
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --bin Insta360Linker
          ./build_macos.sh

      - name: Verify and package app
        shell: bash
        run: |
          set -euo pipefail
          app="dist/Insta360Linker.app"
          output="build/release"
          package="$output/Insta360Linker-macOS-arm64-v${{ steps.version.outputs.value }}.zip"
          test -x "$app/Contents/MacOS/Insta360Linker"
          test -x "$app/Contents/Resources/Insta360LinkerBackend"
          test -x "$app/Contents/Resources/ffmpeg/ffmpeg"
          test -f "$app/Contents/Resources/Assets.car"
          test -f "$app/Contents/Resources/Insta360Linker.icns"
          test -f "$app/Contents/Resources/apk_watermark/ic_watermark_luna_ultra_image_cn.png"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          file "$app/Contents/MacOS/Insta360Linker" | grep -q 'arm64'
          file "$app/Contents/Resources/Insta360LinkerBackend" | grep -q 'arm64'
          if otool -L "$app/Contents/MacOS/Insta360Linker" | grep -q WebKit; then
            echo "The native SwiftUI frontend unexpectedly links WebKit." >&2
            exit 1
          fi
          mkdir -p "$output"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$package"
          package_name="$(basename "$package")"
          (cd "$output" && shasum -a 256 "$package_name" > "$package_name.sha256")

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: Insta360Linker-macOS-arm64-v${{ steps.version.outputs.value }}
          path: build/release
          if-no-files-found: error
          retention-days: 30

  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionMatch = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $versionMatch) { throw "Cargo package version is missing" }
          "value=$($versionMatch.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify source and build binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "Rust formatting check failed" }
          cargo test --locked --bin Insta360Linker
          if ($LASTEXITCODE -ne 0) { throw "Rust test suite failed" }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "Windows release build failed" }

      - name: Download verified FFmpeg runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "ffmpeg-master-latest-win64-gpl.zip"
          $base = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          Invoke-WebRequest -Uri "$base/$asset" -OutFile $asset
          Invoke-WebRequest -Uri "$base/checksums.sha256" -OutFile checksums.sha256
          $expectedLine = Get-Content checksums.sha256 | Where-Object {
            $fields = $_ -split '\s+'
            $fields.Count -gt 1 -and $fields[-1].TrimStart([char]'*') -eq $asset
          } | Select-Object -First 1
          if (-not $expectedLine) { throw "FFmpeg checksum entry is missing" }
          $expected = ($expectedLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "FFmpeg archive checksum mismatch" }
          Expand-Archive -LiteralPath $asset -DestinationPath ffmpeg-package

      - name: Verify and package Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.value }}"
          $root = "build/release/Insta360Linker-Windows-x64-v$version"
          $assets = Join-Path $root "assets"
          $ffmpegAssets = Join-Path $assets "ffmpeg"
          $watermarkAssets = Join-Path $assets "apk_watermark"
          New-Item -ItemType Directory -Force -Path $ffmpegAssets, $watermarkAssets | Out-Null
          Copy-Item -LiteralPath "target/release/Insta360Linker.exe" -Destination $root
          Copy-Item -LiteralPath "target/release/insta360_linker.dll" -Destination (Join-Path $root "Insta360LinkerVirtualCamera.dll")
          Copy-Item -LiteralPath "run_release.bat" -Destination $root
          Copy-Item -LiteralPath "README.md" -Destination $root
          Copy-Item -Path "assets/apk_watermark/*" -Destination $watermarkAssets -Recurse
          $ffmpeg = Get-ChildItem -Path ffmpeg-package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "FFmpeg executable is missing from the verified archive" }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination $ffmpegAssets
          $ffmpegLicense = Get-ChildItem -Path ffmpeg-package -Filter COPYING.GPLv3 -Recurse | Select-Object -First 1
          if ($ffmpegLicense) {
            Copy-Item -LiteralPath $ffmpegLicense.FullName -Destination (Join-Path $ffmpegAssets "COPYING.GPLv3")
          }
          foreach ($required in @(
            (Join-Path $root "Insta360Linker.exe"),
            (Join-Path $root "Insta360LinkerVirtualCamera.dll"),
            (Join-Path $ffmpegAssets "ffmpeg.exe"),
            (Join-Path $watermarkAssets "ic_watermark_luna_ultra_image_cn.png")
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Release file is missing: $required" }
          }
          $package = "build/release/Insta360Linker-Windows-x64-v$version.zip"
          Compress-Archive -Path $root -DestinationPath $package -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          $checksumLine = "$hash  $([System.IO.Path]::GetFileName($package))`n"
          [System.IO.File]::WriteAllText("$package.sha256", $checksumLine, [System.Text.Encoding]::ASCII)

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Insta360Linker-Windows-x64-v${{ steps.version.outputs.value }}
          path: |
            build/release/Insta360Linker-Windows-x64-v${{ steps.version.outputs.value }}.zip
            build/release/Insta360Linker-Windows-x64-v${{ steps.version.outputs.value }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  android-arm64:
    name: Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Read and verify package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | tr -d '\r' | head -n 1)"
          test -n "$version"
          grep -Fq "versionName \"$version\"" android/app/build.gradle
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION"

      - name: Compile Rust JNI library
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          toolchain="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo build --lib --release --target aarch64-linux-android --locked
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libinsta360_linker.so \
            android/app/src/main/jniLibs/arm64-v8a/libinsta360_linker.so

      - name: Test and build installable APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          output="build/release"
          apk="$output/Insta360Linker-Android-arm64-v${{ steps.version.outputs.value }}-test-signed.apk"
          mkdir -p "$output"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          unzip -Z1 "$apk" > "$output/apk-entries.txt"
          grep -Fxq 'lib/arm64-v8a/libinsta360_linker.so' "$output/apk-entries.txt"
          grep -Fxq 'assets/web/index.html' "$output/apk-entries.txt"
          grep -Fq 'assets/runtime_assets/apk_watermark/' "$output/apk-entries.txt"
          rm "$output/apk-entries.txt"
          apk_name="$(basename "$apk")"
          (cd "$output" && sha256sum "$apk_name" > "$apk_name.sha256")

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: Insta360Linker-Android-arm64-v${{ steps.version.outputs.value }}
          path: build/release
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    name: Publish GitHub prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - macos-arm64
      - windows-x64
      - android-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          pattern: Insta360Linker-*
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print | sort
          printf '%s\n' \
            'macOS ARM64 使用 Xcode 27 构建并进行 ad-hoc 签名；Windows x64 包含虚拟摄像机 DLL、FFmpeg 与官方水印资源；Android ARM64 APK 使用测试签名，升级后续正式签名版本前可能需要先卸载。' \
            '' \
            '所有文件均附带 SHA-256 校验文件。' > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --title "Insta360Linker $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --prerelease \
            --verify-tag
