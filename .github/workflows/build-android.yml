name: Build Android ARM64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION"

      - name: Compile Rust JNI library
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo build --lib --release --target aarch64-linux-android --locked
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libluna_mic_rust.so \
            android/app/src/main/jniLibs/arm64-v8a/libluna_mic_rust.so

      - name: Build debug APK
        working-directory: android
        run: ./gradlew lintDebug assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/android-artifact
          apk="build/android-artifact/Insta360Linker-android-arm64-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libluna_mic_rust.so'
          unzip -l "$apk" | grep -q 'assets/web/index.html'
          unzip -l "$apk" | grep -q 'assets/runtime_assets/apk_watermark/'
          sha256sum "$apk" | tee build/android-artifact/SHA256SUMS.txt

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: Insta360Linker-android-arm64-debug
          path: build/android-artifact
          if-no-files-found: error
          retention-days: 14
