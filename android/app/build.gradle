plugins {
    id "com.android.application"
}

android {
    namespace "studio.insta360.linker"
    compileSdk 36

    defaultConfig {
        applicationId "studio.insta360.linker"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main {
            assets.srcDir("$buildDir/generated/runtimeAssets")
        }
    }
}

dependencies {
    implementation "androidx.media3:media3-transformer:1.10.1"
    implementation "androidx.media3:media3-effect:1.10.1"
    implementation "androidx.media3:media3-common:1.10.1"
    testImplementation "junit:junit:4.13.2"
}

def prepareRuntimeAssets = tasks.register("prepareRuntimeAssets", Sync) {
    into(layout.buildDirectory.dir("generated/runtimeAssets"))
    from("../../web") {
        include "index.html", "app.css", "app-icon.png"
        into "web"
    }
    from("../../assets/apk_watermark") {
        into "runtime_assets/apk_watermark"
    }
}

tasks.named("preBuild").configure {
    dependsOn(prepareRuntimeAssets)
}
